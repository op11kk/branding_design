<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#587d94" />
    <meta name="description" content="Join the EgoClip waitlist and turn everyday life into real-world value." />
    <title>UBL — Join the EgoClip waitlist</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="page" id="page">
      <header class="nav-shell">
        <a class="brand" href="#top" aria-label="UBL home">UBL</a>
        <button class="nav-cta" id="navCta">Join waitlist <span aria-hidden="true">↗</span></button>
      </header>

      <section class="conversion" id="top">
        <div class="portrait portrait-left">
          <img src="./素材/草莓金发男生-EgoClip-向上看.png" alt="Person wearing EgoClip at the center of the chest" />
        </div>
        <div class="portrait portrait-right">
          <img src="./素材/草莓金发男生-EgoClip-直视镜头.png" alt="Person wearing EgoClip in everyday life" />
        </div>

        <div class="conversion-copy">
          <p class="eyebrow"><span></span> Waitlist open</p>
          <h1>Your day already has value.</h1>
          <p class="lead">Wear EgoClip. Live normally. Earn from the real-world data you create.</p>

          <form class="access-form" id="accessForm">
            <label class="sr-only" for="join">Email address</label>
            <input id="join" type="email" required placeholder="Your email address" autocomplete="email" />
            <button type="submit">Join waitlist <span aria-hidden="true">↗</span></button>
          </form>
          <p class="form-note">Free to join · No expertise required</p>
        </div>

        <footer class="page-foot">
          <span>© 2026 UBL</span>
          <span>Real life. Real value.</span>
        </footer>
      </section>
    </main>
    <script src="./src/script.js"></script>
  </body>
</html>
