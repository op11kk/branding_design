<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Wear Eagle Clip, live your day, and turn everyday moments into useful real-world data."
    />
    <title>Eagle Clip — Wear it. Live your day. Earn it.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <section class="story" aria-labelledby="story-title">
        <div class="scene">
          <div class="landscape" aria-hidden="true"></div>
          <div class="atmosphere" aria-hidden="true">
            <span class="light light--one"></span>
            <span class="light light--two"></span>
            <span class="grain"></span>
          </div>

          <div class="photo-field" aria-hidden="true">
            <div class="photo photo--1" data-x="-0.43" data-y="-0.27" data-rotate="0">
              <div class="photo__surface scene-1"></div>
            </div>
            <div class="photo photo--2" data-x="-0.2" data-y="-0.39" data-rotate="0">
              <div class="photo__surface scene-2"></div>
            </div>
            <div class="photo photo--3" data-x="0.25" data-y="-0.36" data-rotate="0">
              <div class="photo__surface scene-3"></div>
            </div>
            <div class="photo photo--4" data-x="0.43" data-y="-0.08" data-y-mobile="-0.25" data-rotate="0">
              <div class="photo__surface scene-4"></div>
            </div>
            <div class="photo photo--5" data-x="-0.42" data-y="0.3" data-rotate="0">
              <div class="photo__surface scene-5"></div>
            </div>
            <div class="photo photo--6" data-x="-0.2" data-y="0.42" data-rotate="0">
              <div class="photo__surface scene-6"></div>
            </div>
            <div class="photo photo--7" data-x="0.12" data-y="0.39" data-rotate="0">
              <div class="photo__surface scene-7"></div>
            </div>
            <div class="photo photo--8" data-x="0.39" data-y="0.31" data-rotate="0">
              <div class="photo__surface scene-8"></div>
            </div>
            <span class="capture-point"></span>
          </div>

          <div class="copy">
            <h1 id="story-title">
              <span>Wear it, live your day,</span>
              <em>earn it.</em>
            </h1>
            <p>
              Before you start, you’ll see exactly what to do, what it can earn,
              and what we’re looking for.
            </p>
          </div>

          <div class="progress" aria-hidden="true">
            <span></span>
          </div>
          <p class="sr-only">
            Scroll to reveal moments from everyday life radiating outward from
            the center of the page.
          </p>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
