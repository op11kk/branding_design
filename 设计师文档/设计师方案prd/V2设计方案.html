<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EgoClip 官网视觉与交互设计方案</title>
  <style>
    :root { --ink:#183b68; --paper:#fff9ef; --apricot:#fff0df; --sun:#f6bd4b; --coral:#f58a5c; --line:#d9d1c2; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f1e8d2; color:#193456; font:16px/1.72 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    header { padding:64px max(28px,calc((100vw - 1080px)/2)); color:var(--paper); background:var(--ink); }
    header p { margin:8px 0 0; color:#d7e7ef; }
    h1,h2,h3 { letter-spacing:-.04em; line-height:1.1; }
    h1 { margin:0; font-size:clamp(38px,6vw,72px); }
    main { width:min(1080px,calc(100% - 40px)); margin:32px auto 72px; padding:clamp(24px,5vw,66px); border-radius:24px; background:var(--paper); box-shadow:0 24px 70px rgba(24,59,104,.12); }
    h2 { margin:66px 0 24px; padding-top:22px; border-top:1px solid var(--line); color:var(--ink); font-size:clamp(28px,4vw,46px); }
    h3 { margin:34px 0 12px; color:var(--coral); font-size:21px; }
    p { margin:0 0 16px; }
    ul,ol { margin:0 0 20px; padding-left:1.35em; }
    li { margin:6px 0; }
    blockquote { margin:0 0 26px; padding:16px 20px; border-left:4px solid var(--sun); border-radius:0 12px 12px 0; background:var(--apricot); color:#36516f; }
    hr { margin:48px 0; border:0; border-top:1px solid var(--line); }
    table { width:100%; margin:20px 0 28px; border-collapse:separate; border-spacing:0; overflow:hidden; border:1px solid var(--line); border-radius:14px; font-size:14px; }
    th,td { padding:12px 14px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { color:var(--ink); background:#d7e7ef; font-weight:750; }
    tr:last-child td { border-bottom:0; } th:last-child,td:last-child { border-right:0; }
    pre { margin:0 0 20px; padding:18px; overflow:auto; border-radius:14px; color:#f6f1e5; background:#183b68; }
    img { display:block; width:min(720px,100%); margin:22px auto 30px; border-radius:18px; box-shadow:0 18px 38px rgba(24,59,104,.18); }
    strong { color:var(--ink); }
    @media (max-width:600px) { header{padding:42px 24px} main{width:calc(100% - 24px); padding:24px 18px; margin:12px auto 32px} table{display:block;overflow-x:auto} }
  </style>
</head>

  <script>
    const source = new TextDecoder().decode(Uint8Array.from(atob(document.querySelector('#source').textContent.trim()), c => c.charCodeAt(0)));
    const esc = value => value.replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const inline = value => esc(value)
      .replace(/!\[([^\]]*)\]\(([^)]*)\)/g, (_, alt, src) => '<img alt="' + alt + '" src="' + (src.startsWith('assets/') ? 'file:///Users/mac/Downloads/harmone-web/' + src : src) + '">')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    const lines = source.replace(/\r/g,'').split('\n');
    let html = '', index = 0;
    while (index < lines.length) {
      const line = lines[index];
      if (/^~~~/.test(line)) { const code=[]; index++; while (index < lines.length && !/^~~~/.test(lines[index])) code.push(lines[index++]); html += '<pre><code>' + esc(code.join('\n')) + '</code></pre>'; index++; continue; }
      if (/^\|/.test(line)) { const rows=[]; while (index < lines.length && /^\|/.test(lines[index])) rows.push(lines[index++]); const usable=rows.filter((row,n)=> n!==1 || !/^-/.test(row.replace(/[|\s:]/g,''))); const cells=row=>row.split('|').slice(1,-1).map(x=>inline(x.trim())); const head=cells(usable[0]); const body=usable.slice(1); html += '<table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+body.map(row=>'<tr>'+cells(row).map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>'; continue; }
      if (/^---+$/.test(line)) { html += '<hr>'; index++; continue; }
      const heading = line.match(/^(#{1,3})\s+(.*)$/); if (heading) { const tag='h'+heading[1].length; html += '<'+tag+'>'+inline(heading[2])+'</'+tag+'>'; index++; continue; }
      if (/^>\s?/.test(line)) { html += '<blockquote>'+inline(line.replace(/^>\s?/,''))+'</blockquote>'; index++; continue; }
      if (/^[-*]\s+/.test(line)) { const items=[]; while(index<lines.length && /^[-*]\s+/.test(lines[index])) items.push('<li>'+inline(lines[index++].replace(/^[-*]\s+/,''))+'</li>'); html += '<ul>'+items.join('')+'</ul>'; continue; }
      if (/^\d+\.\s+/.test(line)) { const items=[]; while(index<lines.length && /^\d+\.\s+/.test(lines[index])) items.push('<li>'+inline(lines[index++].replace(/^\d+\.\s+/,''))+'</li>'); html += '<ol>'+items.join('')+'</ol>'; continue; }
      if (line.trim()) html += '<p>'+inline(line)+'</p>';
      index++;
    }
    document.querySelector('#document').innerHTML = html;
  </script>
